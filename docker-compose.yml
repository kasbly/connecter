services:
  connector:
    build: .
    # Loopback by default: the bundled Caddy proxy below is the only intended
    # path to the connector, and `custom` puts the operator's own proxy on
    # this same host. The `none` topology (no proxy at all) is the one case
    # that needs the connector reachable from the network, so `npm run setup`
    # writes CONNECTOR_BIND=0.0.0.0 to .env when that topology is chosen (see
    # wizard.ts) — this default only applies when CONNECTOR_BIND is unset.
    ports:
      - '${CONNECTOR_BIND:-127.0.0.1}:4000:4000'
    volumes:
      - ./connector.config.yml:/app/connector.config.yml:ro
      - ./logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    # Lets the container resolve host.docker.internal back to this host. Needed
    # when `npm run setup` rewrites a loopback DB_HOST to host.docker.internal
    # because "localhost" inside this container is the connector process
    # itself, not the host Postgres the wizard just introspected (#28245).
    # Docker Desktop (Mac/Windows) already resolves this name without an
    # entry; `host-gateway` is what makes it work on Linux too.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:4000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      connector_network:
        ipv4_address: 172.30.0.3

  caddy:
    image: caddy:2.10-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Not `:?required` — `custom`/`none` never set CONNECTOR_DOMAIN, and Compose
      # interpolates the whole file (including services not being started) before
      # selecting one, so `docker compose up -d connector` on those topologies would
      # otherwise abort demanding a public DNS name this service is the only consumer of.
      CONNECTOR_DOMAIN: ${CONNECTOR_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      connector:
        condition: service_started
    networks:
      connector_network:
        ipv4_address: 172.30.0.2

volumes:
  caddy_data:
  caddy_config:

networks:
  connector_network:
    ipam:
      config:
        - subnet: 172.30.0.0/24
