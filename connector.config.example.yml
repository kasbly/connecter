version: 1

server:
  port: 4000
  host: '0.0.0.0'
  # The bundled Docker HTTPS deployment uses Caddy at this fixed internal IP.
  # Keep this value when using docker compose; change it to your own proxy's
  # IP/CIDR only if you replace Caddy. Forwarded headers are trusted only when
  # the direct connection comes from this allowlist.
  trustedProxies: '172.30.0.2'

auth:
  apiKeys:
    - key: '${CONNECTOR_API_KEY}'
      label: 'kasbly-production'

database:
  type: postgres
  host: '${DB_HOST}'
  port: 5432
  database: '${DB_NAME}'
  user: '${DB_USER}'
  password: '${DB_PASSWORD}'
  ssl: false # Set true to enable TLS with certificate verification
  # sslCa: '${DB_SSL_CA}' # Optional PEM CA certificate/bundle for a private CA
  # sslRejectUnauthorized: true # Default; false disables server authentication
  statementTimeoutMs: 10000 # Cancels merchant DB queries that exceed 10 seconds
  pool: { min: 2, max: 10 }

rateLimit:
  maxRequests: 100
  windowSeconds: 60

audit:
  enabled: true
  filePath: './logs/audit.log'
  maxFileSizeMB: 50
  maxFiles: 10 # Rotated files to retain; live plus rotations use up to 550 MB at this size
  retentionDays: 90
  # History lasts the smaller of retentionDays and the time traffic fills
  # (maxFiles + 1) x maxFileSizeMB. Increase either size setting for busy connectors.

resources:
  inventory:
    # PostgreSQL schema. Omit to use public.
    schema: 'public'
    table: 'Car'
    baseFilter: 'published = true AND "deletedAt" IS NULL'
    idColumn: 'id'
    updatedAtColumn: '"updatedAt"'

    fields:
      externalId: 'id'
      title: 'title'
      price: 'price'
      currency: "'KRW'"
      category: "'car'"
      # Omit this line only when every listing is Active: an unmapped status
      # field reports every listing as ACTIVE. Once mapped, a source value that
      # statusValues below does not recognize falls back to unknownStatusPolicy.
      status: 'status'
      # Optional: one URL, a PostgreSQL text[] value, or a JSON array of URL strings.
      # Row images come first, followed by images from relations below.
      images: 'image_urls'

    # Map source-system availability terms to Kasbly's five status tokens.
    # Defaults accept ACTIVE, DRAFT, RESERVED, SOLD, and EXPIRED (case-insensitive).
    statusValues:
      ACTIVE: ['active', 'for_sale']
      DRAFT: ['draft']
      RESERVED: ['reserved']
      SOLD: ['sold']
      EXPIRED: ['expired']

    attributes:
      makeEn: '"makeEn"'
      makeAr: '"makeAr"'
      modelEn: '"modelEn"'
      modelAr: '"modelAr"'
      year: 'year'
      fuelType: '"fuelType"'
      transmission: 'transmission'
      kilometers: 'kilometers'
      color: 'color'

    searchableColumns: ['title', '"makeEn"', '"modelEn"']

    filterableColumns:
      status: { column: 'status', type: 'string' }
      year: { column: 'year', type: 'number' }
      minYear: { column: 'year', type: 'gte' }
      maxYear: { column: 'year', type: 'lte' }
      make: { column: '"makeEn"', type: 'string' }
      model: { column: '"modelEn"', type: 'string' }
      fuelType: { column: '"fuelType"', type: 'string' }
      transmission: { column: 'transmission', type: 'string' }
      color: { column: 'color', type: 'string' }
      minPrice: { column: 'price', type: 'gte' }
      maxPrice: { column: 'price', type: 'lte' }

    relations:
      images:
        schema: 'public'
        table: 'Image'
        foreignKey: '"carId"'
        referenceKey: 'id'
        fields: { url: 'url', type: 'type' }
        imageUrlField: 'url'
        filter: "type = 'gallery' OR type = 'featured'"
        orderBy: { column: 'type', direction: 'asc' } # featured images first
      features:
        schema: 'public'
        table: 'CarFeatures'
        foreignKey: '"carId"'
        referenceKey: 'id'
        fields: { name: '"featureName"' }
        flatten: 'name'
